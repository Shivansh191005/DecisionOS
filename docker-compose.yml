version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: decisionos-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decisionos_db}
      POSTGRES_USER: ${POSTGRES_USER:-decisionos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionos_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decisionos} -d ${POSTGRES_DB:-decisionos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: decisionos-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: decisionos-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-decisionos}:${POSTGRES_PASSWORD:-decisionos_secret_2026}@postgres:5432/${POSTGRES_DB:-decisionos_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-enterprise_super_secret_jwt_key_2026_decisionos}
      - BACKEND_CORS_ORIGINS=["http://localhost", "http://localhost:3000", "http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: decisionos-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-decisionos}:${POSTGRES_PASSWORD:-decisionos_secret_2026}@postgres:5432/${POSTGRES_DB:-decisionos_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-enterprise_super_secret_jwt_key_2026_decisionos}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: >
      celery -A app.workers.celery_app worker --loglevel=info -Q default,email,audit,ml_training,ml_inference,reports

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: decisionos-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: decisionos-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
