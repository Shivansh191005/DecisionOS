name: DecisionOS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend CI (FastAPI + Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decisionos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx ruff

      - name: Lint with Ruff
        run: |
          ruff check backend/app backend/tests --ignore E501,F401,E402,F821,I001,W291 --select E,F,W

      - name: Run Pytest test suite with coverage
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/decisionos_test"
          SYNC_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/decisionos_test"
          SECRET_KEY: "ci-test-secret-key-decisionos-ai-platform-test-only"
          ENVIRONMENT: "test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest backend/tests/ -v --cov=app

  frontend-test:
    name: Frontend CI (Next.js 15 + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npm run type-check --if-present

      - name: Build Next.js application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build
