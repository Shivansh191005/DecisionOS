[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionos-backend"
version = "0.1.0"
description = "Backend API & AI Decision Engine for DecisionOS Enterprise SaaS Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DecisionOS Engineering Team", email = "engineering@decisionos.ai"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.2",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.1",
    "xgboost>=2.1.1",
    "lightgbm>=4.4.0",
    "shap>=0.46.0",
    "openai>=1.47.0",
    "google-generativeai>=0.8.2",
    "langchain>=0.2.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.3",
    "mypy>=1.11.2",
    "httpx>=0.27.2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"
